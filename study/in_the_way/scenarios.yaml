    compressor       13:00         at least 4 h apart from the battery bank; 2 h apart from the welder
    drill set        20:00
    lamps            22:00

    Schedules the app suggests:
    A. 07:00 (battery bank, laptop, welder) / 13:00 (compressor) / 21:00 (drill set, lamps)
    B. 08:00 (battery bank, laptop) / 12:00 (welder, compressor) / 21:00 (drill set, lamps)
